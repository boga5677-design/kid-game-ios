name: PetLingo Kids iPhone iPad Installable IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build Signed iPhone iPad IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode Version
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Validate Project
        run: |
          set -euo pipefail

          test -d KidsPetLearning.xcodeproj

          xcodebuild \
            -project KidsPetLearning.xcodeproj \
            -scheme KidsPetLearning \
            -list

      - name: Check Signing Secrets
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail

          ERROR=0

          if [ -z "$IOS_P12_BASE64" ]; then
            echo "::error::缺少 IOS_P12_BASE64"
            ERROR=1
          fi

          if [ -z "$IOS_P12_PASSWORD" ]; then
            echo "::error::缺少 IOS_P12_PASSWORD"
            ERROR=1
          fi

          if [ -z "$IOS_MOBILEPROVISION_BASE64" ]; then
            echo "::error::缺少 IOS_MOBILEPROVISION_BASE64"
            ERROR=1
          fi

          if [ "$ERROR" -ne 0 ]; then
            exit 1
          fi

      - name: Install Certificate and Provisioning Profile
        id: signing
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail

          SIGN_DIR="$RUNNER_TEMP/PetLingoSigning"
          KEYCHAIN_PATH="$RUNNER_TEMP/PetLingo.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          P12_PATH="$SIGN_DIR/certificate.p12"
          PROFILE_PATH="$SIGN_DIR/profile.mobileprovision"
          PROFILE_PLIST="$SIGN_DIR/profile.plist"

          mkdir -p "$SIGN_DIR"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$P12_PATH"
          printf '%s' "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )

          TEAM_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$PROFILE_PLIST"
          )

          APP_IDENTIFIER=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )

          BUNDLE_ID="${APP_IDENTIFIER#${TEAM_ID}.}"

          if [[ "$BUNDLE_ID" == *"*"* ]]; then
            echo "::error::Provisioning Profile 不可使用 wildcard App ID"
            exit 1
          fi

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          CERT_IDENTITY=$(
            security find-identity \
              -v \
              -p codesigning \
              "$KEYCHAIN_PATH" \
              | awk -F'"' \
              '/Apple Development|Apple Distribution|iPhone Developer|iPhone Distribution/ {print $2; exit}'
          )

          if [ -z "$CERT_IDENTITY" ]; then
            echo "::error::找不到 Apple Code Signing Certificate"
            exit 1
          fi

          GET_TASK_ALLOW=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:get-task-allow" \
              "$PROFILE_PLIST" \
              2>/dev/null || echo "false"
          )

          FIRST_DEVICE=$(
            /usr/libexec/PlistBuddy \
              -c "Print :ProvisionedDevices:0" \
              "$PROFILE_PLIST" \
              2>/dev/null || true
          )

          if [ -z "$FIRST_DEVICE" ]; then
            echo "::error::Provisioning Profile 沒有註冊裝置。請使用 Development 或 Ad Hoc Profile。"
            exit 1
          fi

          if [ "$GET_TASK_ALLOW" = "true" ]; then
            EXPORT_METHOD="development"
          else
            EXPORT_METHOD="ad-hoc"
          fi

          {
            echo "team_id=$TEAM_ID"
            echo "bundle_id=$BUNDLE_ID"
            echo "profile_uuid=$PROFILE_UUID"
            echo "profile_name=$PROFILE_NAME"
            echo "cert_identity=$CERT_IDENTITY"
            echo "export_method=$EXPORT_METHOD"
            echo "keychain_path=$KEYCHAIN_PATH"
          } >> "$GITHUB_OUTPUT"

          echo "Team ID: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Profile: $PROFILE_NAME"
          echo "Export Method: $EXPORT_METHOD"

      - name: Archive iPhone iPad App
        env:
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle_id }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          CERT_IDENTITY: ${{ steps.signing.outputs.cert_identity }}
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: |
          set -o pipefail

          LOG_DIR="$RUNNER_TEMP/PetLingoLogs"
          ARCHIVE_PATH="$RUNNER_TEMP/PetLingoKids.xcarchive"

          mkdir -p "$LOG_DIR"
          rm -rf "$ARCHIVE_PATH"

          xcodebuild \
            -project KidsPetLearning.xcodeproj \
            -scheme KidsPetLearning \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CERT_IDENTITY" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            SUPPORTS_MACCATALYST=NO \
            SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD=NO \
            clean archive \
            2>&1 | tee "$LOG_DIR/archive.log"

      - name: Create Export Options
        env:
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle_id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          EXPORT_METHOD: ${{ steps.signing.outputs.export_method }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">

          <dict>

              <key>method</key>
              <string>$EXPORT_METHOD</string>

              <key>destination</key>
              <string>export</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>$TEAM_ID</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>thinning</key>
              <string>&lt;none&gt;</string>

          </dict>

          </plist>
          EOF

          plutil \
            -lint \
            "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export Installable IPA
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: |
          set -o pipefail

          EXPORT_DIR="$RUNNER_TEMP/PetLingoIPA"
          LOG_DIR="$RUNNER_TEMP/PetLingoLogs"

          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/PetLingoKids.xcarchive" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            2>&1 | tee "$LOG_DIR/export.log"

          IPA=$(find "$EXPORT_DIR" \
            -maxdepth 1 \
            -name "*.ipa" \
            -print \
            -quit)

          if [ -z "$IPA" ]; then
            echo "::error::沒有產生 IPA"
            exit 1
          fi

          mv "$IPA" \
            "$EXPORT_DIR/PetLingoKids-iOS.ipa"

          echo "IPA created:"
          ls -lh \
            "$EXPORT_DIR/PetLingoKids-iOS.ipa"

      - name: Verify IPA
        run: |
          set -euo pipefail

          VERIFY_DIR="$RUNNER_TEMP/PetLingoVerify"

          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          unzip \
            -q \
            "$RUNNER_TEMP/PetLingoIPA/PetLingoKids-iOS.ipa" \
            -d "$VERIFY_DIR"

          APP=$(find \
            "$VERIFY_DIR/Payload" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            -print \
            -quit)

          test -n "$APP"

          PLATFORM=$(
            /usr/libexec/PlistBuddy \
              -c "Print :DTPlatformName" \
              "$APP/Info.plist"
          )

          echo "Platform: $PLATFORM"

          if [ "$PLATFORM" != "iphoneos" ]; then
            echo "::error::產生的不是 iPhone/iPad 實機版本"
            exit 1
          fi

          test -f \
            "$APP/embedded.mobileprovision"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

          echo "IPA verification passed."

      - name: Print Build Errors
        if: failure()
        run: |
          echo "================ ERRORS ================"

          for LOG in \
            "$RUNNER_TEMP/PetLingoLogs/archive.log" \
            "$RUNNER_TEMP/PetLingoLogs/export.log"
          do

            if [ -f "$LOG" ]; then

              echo "---- $LOG ----"

              grep -nE \
                'error:|fatal error:|Provisioning profile|No signing certificate|ARCHIVE FAILED|EXPORT FAILED|The following build commands failed' \
                "$LOG" || true

            fi

          done

          echo "========================================"

      - name: Upload Installable IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PetLingoKids-iOS-Installable-IPA
          path: ${{ runner.temp }}/PetLingoIPA/PetLingoKids-iOS.ipa
          compression-level: 0
          if-no-files-found: error

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PetLingoKids-iOS-Signing-Logs
          path: |
            ${{ runner.temp }}/PetLingoLogs/*.log
            ${{ runner.temp }}/ExportOptions.plist
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/PetLingo.keychain-db" \
            2>/dev/null || true

          rm -rf \
            "$RUNNER_TEMP/PetLingoSigning"
